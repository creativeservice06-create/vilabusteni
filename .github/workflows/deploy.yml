# Deploy automat: la fiecare push pe ramura "main",
# conținutul folderului "site/" este urcat prin FTP în public_html pe cPanel.
#
# Secrets necesare (GitHub → Settings → Secrets and variables → Actions):
#   (serverul e IP-ul găzduirii, scris mai jos – nu e secret)
#   FTP_USERNAME  deploy@vilabusteni.ro  (cont FTP dedicat, creat în cPanel)
#   FTP_PASSWORD  parola contului FTP
#
# Se urcă doar fișierele modificate. Fișierul config.php de pe server
# NU este suprascris (vezi "exclude").

name: Deploy pe cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: # permite și pornirea manuală din tab-ul Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descarcă codul
        uses: actions/checkout@v4

      - name: Test conexiune server (diagnostic)
        run: |
          echo "IP runner GitHub: $(curl -s https://api.ipify.org)"
          timeout 15 bash -c 'echo > /dev/tcp/93.113.55.2/21' && echo "Port 21: DESCHIS" || echo "Port 21: BLOCAT / timeout"

      - name: Urcă site-ul prin FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 93.113.55.2   # IP-ul contului cPanel (Shared IP Address)
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          log-level: verbose
          local-dir: ./site/
          # Contul FTP dedicat (deploy@vilabusteni.ro) are directorul setat direct
          # pe public_html, deci urcăm în rădăcina lui: "./".
          # Dacă folosești contul principal cPanel, schimbă în "public_html/".
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            config.php
